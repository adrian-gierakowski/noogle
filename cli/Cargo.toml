[package]
name = "noogle-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
once_cell = "1.18"
unicode-width = "0.1.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
ratatui = { version = "0.26", features = ["crossterm"] }
crossterm = "0.27"
fuzzy-matcher = "0.3.7"
# termimad = "0.29"
anyhow = "1.0"
directories = "5.0"
open = "5.1"
